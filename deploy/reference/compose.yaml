# REFERENCE DEPLOYMENT — not production (docs/DEPLOYMENT.md). It runs the real images against the real dependencies
# they need, on one machine, so the release can be started with its production configuration and probed end to end.
# Production differs in every place marked PRODUCTION: a managed PostgreSQL 18 with point-in-time recovery, AWS KMS,
# S3 with Object Lock, a TLS-terminating load balancer per host, and secrets from a secret manager.
#
#   cp deploy/reference/env.example deploy/reference/.env   # fill in; never commit .env
#   docker compose -f deploy/reference/compose.yaml --env-file deploy/reference/.env up -d postgres minio
#   docker compose -f deploy/reference/compose.yaml --env-file deploy/reference/.env run --rm migrate
#   docker compose -f deploy/reference/compose.yaml --env-file deploy/reference/.env up -d web worker
name: inrp2p-reference

services:
  postgres:
    image: postgres:18.6
    # PRODUCTION: a managed PostgreSQL 18 with continuous WAL archiving and point-in-time recovery (E4, TD-16).
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /archive/%f && cp %p /archive/%f
      - -c
      - archive_timeout=60
      - -c
      - max_connections=200
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      INRP2P_MIGRATOR_PASSWORD: ${INRP2P_MIGRATOR_PASSWORD:?}
      INRP2P_APP_PASSWORD: ${INRP2P_APP_PASSWORD:?}
      INRP2P_WORKER_PASSWORD: ${INRP2P_WORKER_PASSWORD:?}
      INRP2P_READONLY_PASSWORD: ${INRP2P_READONLY_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql
      - pgarchive:/archive
      - ./postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    # PRODUCTION: S3 buckets created with versioning and Object Lock; never public (E2, E4).
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${INRP2P_S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${INRP2P_S3_SECRET_KEY:?}
    volumes:
      - s3data:/data

  migrate:
    image: inrp2p-migrate:${RELEASE:-local}
    environment:
      DATABASE_MIGRATOR_URL: postgres://inrp2p_migrator:${INRP2P_MIGRATOR_PASSWORD}@postgres:5432/inrp2p
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    image: inrp2p-web:${RELEASE:-local}
    env_file: [web.env]
    environment:
      DATABASE_URL: postgres://inrp2p_app_login:${INRP2P_APP_PASSWORD}@postgres:5432/inrp2p
    ports: ["3000:3000"]
    depends_on: [postgres]

  worker:
    image: inrp2p-worker:${RELEASE:-local}
    env_file: [worker.env]
    environment:
      WORKER_DATABASE_URL: postgres://inrp2p_worker_login:${INRP2P_WORKER_PASSWORD}@postgres:5432/inrp2p
    depends_on: [postgres]
    stop_grace_period: 60s

volumes:
  pgdata:
  pgarchive:
  s3data:
