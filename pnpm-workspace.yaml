packages:
  - "packages/*"
  - "apps/*"

# Dependency build-script policy (see docs/DEPENDENCIES.md "Build scripts").
# pnpm 12 runs no dependency install scripts unless explicitly allowed here; in CI any package
# with a build script that is not listed fails the install (ERR_PNPM_IGNORED_BUILDS).
# No package in the current graph needs its build script, so every entry is `false`.
allowBuilds:
  # testcontainers → dockerode → docker-modem / ssh-remote-port-forward → ssh2.
  # Script builds an OPTIONAL native crypto binding with node-gyp; ssh2 falls back to pure JS.
  # SSH is not used: Testcontainers talks to the local Docker socket.
  ssh2: false
  # optionalDependency of ssh2: node-gyp build of CPU feature detection, only used by that binding.
  cpu-features: false
  # dockerode → @grpc/proto-loader → protobufjs. postinstall only prints a version-scheme warning.
  protobufjs: false
  # storybook / vite → esbuild. postinstall only swaps the JS launcher for the platform binary
  # from the optional @esbuild/<platform> package (already installed); esbuild works without it.
  esbuild: false

# TD-01: Better Auth declares `rateLimit.lastRequest` as `number` with `bigint: true` and creates it as `bigint`, but its
# migration planner compares column types by name and lists `bigint` without `int8` — the name the introspector
# reports for that very column — so it warned about the schema Better Auth itself requires. The patch adds the
# PostgreSQL type names (`int8`, `int2`, `float4`, `float8`) to the planner's number list; nothing at runtime changes.
# Re-check (and drop) it on every Better Auth upgrade: `packages/identity/test/auth.int.test.ts` fails if the planner
# warns about anything.
patchedDependencies:
  better-auth@1.7.5: patches/better-auth@1.7.5.patch
