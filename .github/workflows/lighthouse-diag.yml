name: lighthouse-diag
on:
  push:
    branches: ['diag/lh-*']
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @inrp2p/web exec playwright install --with-deps chromium
      - run: pnpm --filter @inrp2p/web build
      - name: Trace
        run: pnpm --filter @inrp2p/web exec node lighthouse/_trace.local.ts
        env:
          TRACE_OUT: ${{ runner.temp }}/lh
          LIGHTHOUSE_PORT: '3240'
          LIGHTHOUSE_RUNS: '3'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lh
          path: ${{ runner.temp }}/lh
          retention-days: 3
