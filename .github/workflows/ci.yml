name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Integration tests start postgres:18.6 via Testcontainers and assert the exact server version.
      REQUIRE_PG_VERSION: '18.6'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Version matrix
        run: pnpm run versions:check

      - name: Secret scan
        run: pnpm run secret-scan

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build web app
        run: pnpm --filter @inrp2p/web build

      - name: Integration tests (PostgreSQL 18.6 via Testcontainers)
        run: pnpm run test:integration
