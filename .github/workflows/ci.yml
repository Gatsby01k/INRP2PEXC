name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Integration tests start postgres:18.6 via Testcontainers and assert the exact server version.
      REQUIRE_PG_VERSION: '18.6'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Workspace dependency graph (acyclic)
        run: pnpm run workspace:graph

      - name: Version matrix
        run: pnpm run versions:check

      - name: Secret scan
        run: pnpm run secret-scan

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build web app
        run: pnpm --filter @inrp2p/web build

      # The receipt PDF tests print with the pinned Chromium. Without it they would skip, and a skipped gate is
      # not a gate.
      - name: Install Chromium
        run: pnpm --filter @inrp2p/web exec playwright install --with-deps chromium

      - name: Integration tests (PostgreSQL 18.6 via Testcontainers)
        run: pnpm run test:integration

  # The operator product end to end: the built app, a real PostgreSQL, the real commands and the real
  # authorization. Separate from `verify` because it needs a browser and a long-lived database server.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @inrp2p/web exec playwright install --with-deps chromium

      - name: Build web app
        run: pnpm --filter @inrp2p/web build

      - name: End-to-end (operator desk, and the client product on a phone)
        run: pnpm --filter @inrp2p/web test:e2e

      - name: Upload end-to-end report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # The quote link is opened on a phone by someone who has never signed in, while a firm price counts down.
  # Its mobile budget is measured against the built page rather than assumed (IMPLEMENTATION_PLAN Phase 7).
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @inrp2p/web exec playwright install --with-deps chromium

      - name: Build web app
        run: pnpm --filter @inrp2p/web build

      - name: Quote link, mobile budget
        run: pnpm --filter @inrp2p/web test:lighthouse

  # Pixel baselines for the built operator and client pages, compare-only, in the canonical baseline environment
  # (docs/VISUAL_BASELINES.md). Needs a database, because the captures come from real seeded rows.
  visual-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      VISUAL_ENV_IMAGE: mcr.microsoft.com/playwright:v1.56.1-noble
      NEXT_TELEMETRY_DISABLED: '1'
      # Inside a job container, a service is reached by its name rather than on localhost.
      TEST_DATABASE_URL: postgres://postgres@postgres:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @inrp2p/web build

      - name: Page baselines, operator and client (compare only)
        run: pnpm --filter @inrp2p/web test:visual

      - name: Upload visual diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-pages-report
          path: |
            apps/web/playwright-report-visual
            apps/web/test-results
          retention-days: 7

  # Component accessibility, visual regression and reduced motion — compare-only.
  # Runs in the canonical baseline environment (docs/VISUAL_BASELINES.md). Never records baselines:
  # UPDATE_VISUALS is not set here, and the suite's global setup rejects it for push / pull_request events.
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    env:
      VISUAL_ENV_IMAGE: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm --filter @inrp2p/ui build-storybook

      - name: Component accessibility (axe WCAG 2.2 AA), visual regression, reduced motion
        run: pnpm --filter @inrp2p/ui test:visual

      - name: Upload visual diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            packages/ui/playwright-report
            packages/ui/test-results
          retention-days: 7
