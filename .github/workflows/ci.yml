name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Integration tests start postgres:18.6 via Testcontainers and assert the exact server version.
      REQUIRE_PG_VERSION: '18.6'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Workspace dependency graph (acyclic)
        run: pnpm run workspace:graph

      - name: Version matrix
        run: pnpm run versions:check

      - name: Secret scan
        run: pnpm run secret-scan

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build web app
        run: pnpm --filter @inrp2p/web build

      - name: Integration tests (PostgreSQL 18.6 via Testcontainers)
        run: pnpm run test:integration

      - name: Build Storybook
        run: pnpm --filter @inrp2p/ui build-storybook

      - name: Install Playwright Chromium (pinned revision for visual baselines)
        run: pnpm --filter @inrp2p/ui exec playwright install --with-deps chromium

      - name: Component accessibility (axe WCAG 2.2 AA), visual regression, reduced motion
        run: pnpm --filter @inrp2p/ui test:visual

      - name: Upload visual diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            packages/ui/playwright-report
            packages/ui/test-results
          retention-days: 7
